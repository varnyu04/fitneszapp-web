<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>FitneszApp</title>
  <style>
    :root {
      --bg: #070B12;
      --surface: #121A27;
      --text: #F2F6FB;
      --muted: #A9B6C7;
      --sky: #8CCBFF;
      --border: rgba(148, 186, 230, 0.14);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 28rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.75rem;
      color: var(--sky);
      font-weight: 700;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>FitneszApp</h1>
      <p>Edzés- és étkezéskövető mobilalkalmazás — ez a nyilvános weboldal a fiókmegerősítéshez.</p>
    </div>
  </main>
</body>
</html>
