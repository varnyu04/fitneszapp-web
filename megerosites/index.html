<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>FitneszApp — E-mail megerősítés</title>
  <style>
    :root {
      --bg: #070B12;
      --surface: #121A27;
      --text: #F2F6FB;
      --muted: #A9B6C7;
      --sky: #8CCBFF;
      --border: rgba(148, 186, 230, 0.14);
      --danger: #FF7A86;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 28rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
    }
    .brand {
      color: var(--sky);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 0 0 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      line-height: 1.25;
      font-weight: 700;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }
    h1.is-error { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <p class="brand">FitneszApp</p>
      <h1 id="title">Sikeres megerősítés! ✅</h1>
      <p id="message">Az e-mail címed meg van erősítve. Térj vissza a FitneszApp alkalmazásba, és jelentkezz be.</p>
    </div>
  </main>
  <script>
    (function () {
      function hasError(params) {
        return params.has("error") || params.has("error_description");
      }
      var query = new URLSearchParams(window.location.search || "");
      var hashRaw = (window.location.hash || "").replace(/^#/, "");
      var hash = new URLSearchParams(hashRaw);
      if (hasError(query) || hasError(hash)) {
        document.getElementById("title").textContent = "A megerősítés nem sikerült";
        document.getElementById("title").classList.add("is-error");
        document.getElementById("message").textContent =
          "A link lejárt vagy már felhasználták. Próbálj bejelentkezni az appban; ha nem megy, regisztrálj újra vagy kérj új megerősítő e-mailt.";
      }
      if (window.location.hash) {
        history.replaceState(null, "", window.location.pathname + window.location.search);
      }
    })();
  </script>
</body>
</html>
